<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omkar's Offline Notion Clone</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root {
  --bg-color: #f7f7f7;
  --card-color: #fff;
  --primary-color: #4caf50;
  --hover-color: #e0f2f1;
  --text-color: #333;
}

body, html { margin:0; height:100%; font-family:sans-serif; }
.hidden { display:none; }
#login-screen, #app-container { height:100%; display:flex; }
#login-screen { justify-content:center; align-items:center; background:#f0f0f0; flex-direction:column; }
#login-screen input { margin:5px; padding:8px; width:200px; }
#login-screen button { margin:5px; padding:8px 12px; background:var(--primary-color); color:white; border:none; border-radius:4px; cursor:pointer; }

#app-container { display:flex; }
#sidebar { width:250px; background:var(--bg-color); border-right:1px solid #ccc; overflow-y:auto; padding:10px; transition: all 0.3s ease; }
#sidebar h2 { margin-top:0; }
#pages { list-style:none; padding:0; margin:0; }
#pages li { padding:8px; margin:4px 0; background:var(--card-color); border:1px solid #ddd; cursor:grab; border-radius:5px; transition: all 0.2s ease; }
#pages li:hover { background:var(--hover-color); }
#editor-container { flex:1; display:flex; flex-direction:column; background:var(--bg-color); transition: all 0.3s ease; }
#page-title { font-size:1.2em; padding:10px; border-bottom:1px solid #ccc; outline:none; background:var(--card-color); color:var(--text-color); }
#editor { flex:1; }
button { margin:5px 0; padding:5px 10px; border:none; background:var(--primary-color); color:white; border-radius:4px; cursor:pointer; }
.nested { margin-left:15px; }
#theme-toggle { margin-top:10px; background:#333; }
.dark { --bg-color:#1e1e1e; --card-color:#2a2a2a; --primary-color:#4caf50; --hover-color:#3a3a3a; --text-color:#eee; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Login / Register</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="login-btn">Login</button>
  <button id="register-btn">Register</button>
</div>

<div id="app-container" class="hidden">
  <div id="sidebar">
    <h2>Pages</h2>
    <button id="add-page">+ New Page</button>
    <ul id="pages"></ul>
    <button id="theme-toggle">Toggle Dark Mode</button>
  </div>
  <div id="editor-container">
    <input type="text" id="page-title" placeholder="Page Title">
    <div id="editor"></div>
  </div>
</div>

<script>
// ===== IndexedDB Setup =====
let db, currentUser=null;
const request = indexedDB.open('notionCloneUsers', 1);
request.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore('users', { keyPath: 'username' });
};
request.onsuccess = e => { db = e.target.result; };

// ===== Utilities =====
async function hashPassword(password) {
  const enc = new TextEncoder();
  const hash = await crypto.subtle.digest('SHA-256', enc.encode(password));
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ===== Login/Register =====
document.getElementById('register-btn').onclick = async ()=>{
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  if(!u || !p){ alert("Fill both"); return; }
  const tx = db.transaction('users','readwrite');
  const store = tx.objectStore('users');
  store.get(u).onsuccess = async e=>{
    if(e.target.result){ alert("User exists"); return; }
    const hashed = await hashPassword(p);
    store.put({username:u,passwordHash:hashed,pages:[]});
    alert("Registered! Login now."); 
  };
};
document.getElementById('login-btn').onclick = async ()=>{
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const tx = db.transaction('users','readonly');
  const store = tx.objectStore('users');
  store.get(u).onsuccess = async e=>{
    const user = e.target.result;
    if(!user){ alert("No such user"); return; }
    const hashed = await hashPassword(p);
    if(hashed!==user.passwordHash){ alert("Wrong password"); return; }
    currentUser = user.username;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-container').classList.remove('hidden');
    loadPages();
  };
};

// ===== Quill Editor =====
var quill = new Quill('#editor', { theme: 'snow' });

// ===== Page Management =====
let pages=[];
let currentPageId=null;

function saveCurrentUserData(){
  const tx = db.transaction('users','readwrite');
  const store = tx.objectStore('users');
  store.get(currentUser).onsuccess = e=>{
    const user = e.target.result;
    user.pages = pages;
    store.put(user);
  };
}

function addPage(title="New Page"){
  const id = 'page_'+Date.now();
  const page = {id,title,content:'',children:[]};
  pages.push(page);
  currentPageId=id;
  renderSidebar();
  loadEditor(id);
  saveCurrentUserData();
}

function deletePage(id){
  pages = pages.filter(p=>p.id!==id);
  if(currentPageId===id) currentPageId=null;
  renderSidebar();
  saveCurrentUserData();
}

function loadEditor(id){
  const page = pages.find(p=>p.id===id);
  if(!page) return;
  document.getElementById('page-title').value = page.title;
  quill.root.innerHTML = page.content;
}

function renderSidebar(){
  const ul = document.getElementById('pages');
  ul.innerHTML='';
  pages.forEach(p=>{
    const li = document.createElement('li');
    li.textContent=p.title||"Untitled";
    li.dataset.id=p.id;
    li.onclick=()=>{ currentPageId=p.id; loadEditor(p.id); };
    ul.appendChild(li);
  });
  new Sortable(ul,{animation:150,
    onEnd:(evt)=>{
      const moved = pages.splice(evt.oldIndex,1)[0];
      pages.splice(evt.newIndex,0,moved);
      saveCurrentUserData();
    }
  });
}

// Load pages for current user
function loadPages(){
  const tx = db.transaction('users','readonly');
  const store = tx.objectStore('users');
  store.get(currentUser).onsuccess = e=>{
    pages = e.target.result.pages || [];
    renderSidebar();
    if(pages[0]){ currentPageId=pages[0].id; loadEditor(currentPageId); }
  };
}

// ===== Event Listeners =====
document.getElementById('add-page').onclick = ()=> addPage();
document.getElementById('page-title').oninput = e=>{
  if(!currentPageId) return;
  const page = pages.find(p=>p.id===currentPageId);
  page.title=e.target.value;
  renderSidebar();
  saveCurrentUserData();
};
quill.on('text-change', ()=>{
  if(!currentPageId) return;
  const page = pages.find(p=>p.id===currentPageId);
  page.content=quill.root.innerHTML;
  saveCurrentUserData();
});

// ===== Theme Toggle =====
document.getElementById('theme-toggle').onclick = ()=>{
  document.body.classList.toggle('dark');
};
</script>
</body>
</html>
